<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NexaAssist | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #ffffff);
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
    }

    .logo {
      color: #1769e0;
      text-decoration: none;
      font-size: 25px;
      font-weight: 800;
    }

    .home-link {
      text-decoration: none;
      color: #344054;
      font-weight: 600;
    }

    .home-link:hover {
      color: #1769e0;
    }

    .login-wrapper {
      min-height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .login-card h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #667085;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769e0;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #1769e0;
      text-decoration: none;
      font-size: 14px;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      background: #1769e0;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1257bd;
    }

    .login-button:disabled {
      background: #8aaee8;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .signup-text {
      text-align: center;
      margin-top: 25px;
      color: #667085;
      font-size: 14px;
    }

    .signup-text a {
      color: #1769e0;
      text-decoration: none;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 5%;
      }

      .login-wrapper {
        padding: 30px 15px;
      }

      .login-card {
        padding: 28px 22px;
      }

      .login-card h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="logo">
      NexaAssist
    </a>

    <a href="index.html" class="home-link">
      Home
    </a>

  </header>


  <main class="login-wrapper">

    <div class="login-card">

      <h1>Welcome Back</h1>

      <p class="intro">
        Login to your NexaAssist account.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>


        <a href="#" class="forgot" id="forgotPassword">
          Forgot password?
        </a>


        <button type="submit" class="login-button" id="loginButton">
          Login
        </button>

        <div id="message" class="message"></div>

      </form>


      <p class="signup-text">
        Don't have an account?
        <a href="signup.html">
          Create an account
        </a>
      </p>


      <a href="index.html" class="back-home">
        ← Back to NexaAssist
      </a>

    </div>

  </main>


  <script>

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const forgotPassword = document.getElementById("forgotPassword");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      message.style.display = "block";
      message.style.background = "#eaf2ff";
      message.style.color = "#1769e0";
      message.textContent = "Checking your account...";


      try {

        const response = await fetch(
          "https://nexaassist-backend-new-1.onrender.com/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data = await response.json();


        if (response.ok) {

          message.style.background = "#e8f7ee";
          message.style.color = "#18794e";
          message.textContent = "Login successful!";

          localStorage.setItem(
            "nexaassistUser",
            JSON.stringify(data.user)
          );

          setTimeout(function() {
            window.location.href = "index.html";
          }, 1000);

        } else {

          message.style.background = "#fdecec";
          message.style.color = "#b42318";
          message.textContent =
            data.message || "Invalid email or password.";

          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }


      } catch (error) {

        console.log("Login error:", error);

        message.style.background = "#fdecec";
        message.style.color = "#b42318";
        message.textContent =
          "Unable to connect to the server. Please try again.";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });


    forgotPassword.addEventListener("click", function(event) {

      event.preventDefault();

      message.style.display = "block";
      message.style.background = "#fff4e5";
      message.style.color = "#9a6700";

      message.textContent =
        "Password recovery will be added later.";

    });

  </script>

</body>
</html>
