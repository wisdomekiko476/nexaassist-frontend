<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Jobs - NexaAssist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #0b5ed7;
      margin-bottom: 10px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #0b5ed7;
      text-decoration: none;
    }

    .job-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .job-card h2 {
      margin-top: 0;
      color: #0b5ed7;
    }

    .job-info {
      margin: 8px 0;
    }

    .applications {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .application-card {
      background: #f8fafc;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      border-left: 4px solid #0b5ed7;
    }

    .status {
      font-weight: bold;
      color: #d97706;
    }

    .empty {
      color: #666;
      padding: 10px 0;
    }

    .logout {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="client-dashboard.html">← Back to Dashboard</a>

    <h1>My Jobs</h1>

    <p id="welcome"></p>

    <div id="jobsContainer">
      Loading your jobs...
    </div>

    <button class="logout" onclick="logout()">Logout</button>

  </div>

  <script>

    const API_URL = "https://nexaassist-backend-new-1.onrender.com";

    const user = JSON.parse(localStorage.getItem("nexaassistUser"));

    if (!user) {
      window.location.href = "login.html";
    }

    if (user && user.role !== "client") {
      window.location.href = "assistant-dashboard.html";
    }

    document.getElementById("welcome").textContent =
      "Welcome, " + user.fullName;

    async function loadJobs() {

      const container = document.getElementById("jobsContainer");

      try {

        const jobsResponse = await fetch(
          API_URL + "/jobs"
        );

        const jobs = await jobsResponse.json();

        const myJobs = jobs.filter(
          job => job.customerEmail === user.email
        );

        if (myJobs.length === 0) {

          container.innerHTML =
            "<p class='empty'>You have not posted any jobs yet.</p>";

          return;
        }

        const applicationsResponse = await fetch(
          API_URL +
          "/customer-applications?email=" +
          encodeURIComponent(user.email)
        );

        const applications =
          await applicationsResponse.json();

        container.innerHTML = "";

        myJobs.forEach(job => {

          const jobApplications =
            applications.filter(
              application =>
                String(application.jobId) === String(job._id)
            );

          const jobCard =
            document.createElement("div");

          jobCard.className = "job-card";

          let applicationsHTML = "";

          if (jobApplications.length === 0) {

            applicationsHTML =
              "<p class='empty'>No assistants have applied yet.</p>";

          } else {

            jobApplications.forEach(application => {

              const date =
                application.createdAt
                  ? new Date(application.createdAt)
                      .toLocaleDateString()
                  : "Unknown";

              applicationsHTML += `
                <div class="application-card">

                  <strong>
                    Assistant: ${application.assistantName}
                  </strong>

                  <div class="job-info">
                    Email: ${application.assistantEmail}
                  </div>

                  <div class="job-info">
                    Applied: ${date}
                  </div>

                  <div class="job-info">
                    Status:
                    <span class="status">
                      ${application.status}
                    </span>
                  </div>

                </div>
              `;

            });

          }

          jobCard.innerHTML = `

            <h2>${job.title}</h2>

            <div class="job-info">
              <strong>Service:</strong>
              ${job.service}
            </div>

            <div class="job-info">
              <strong>Budget:</strong>
              $${job.budget}
            </div>

            <div class="job-info">
              <strong>Duration:</strong>
              ${job.duration}
            </div>

            <div class="job-info">
              <strong>Description:</strong>
              ${job.description}
            </div>

            <div class="applications">

              <h3>
                Applications (${jobApplications.length})
              </h3>

              ${applicationsHTML}

            </div>

          `;

          container.appendChild(jobCard);

        });

      } catch (error) {

        console.error(error);

        container.innerHTML =
          "<p class='empty'>Unable to load your jobs. Please try again.</p>";

      }

    }

    function logout() {

      localStorage.removeItem("nexaassistUser");

      window.location.href = "login.html";

    }

    loadJobs();

  </script>

</body>
</html>
