<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Jobs - NexaAssist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #222;
    }

    header {
      background: #0b63ce;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #0b63ce;
      font-weight: bold;
    }

    .job-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .job-card h2 {
      margin-top: 0;
      color: #0b63ce;
    }

    .job-info {
      margin: 8px 0;
    }

    .application {
      background: #f4f7fb;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .application h3 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
      margin: 8px 0;
    }

    .pending {
      color: #d88a00;
    }

    .accepted {
      color: green;
    }

    .rejected {
      color: #d00000;
    }

    .assigned {
      color: #0b63ce;
    }

    button {
      background: #0b63ce;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    button:hover {
      background: #084f9f;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dff5e1;
      color: #176b22;
    }

    .error {
      background: #ffe1e1;
      color: #9b0000;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>My Jobs</h1>
</header>

<div class="container">

  <a href="client-dashboard.html" class="back">← Back to Dashboard</a>

  <div id="message" class="message"></div>

  <div id="jobsContainer">
    <div class="empty">Loading your jobs...</div>
  </div>

</div>

<script>
  const API = "https://nexaassist-backend-new-1.onrender.com";

  const user = JSON.parse(localStorage.getItem("nexaassistUser"));

  if (!user) {
    window.location.href = "login.html";
  }

  if (user && user.role !== "client") {
    window.location.href = "assistant-dashboard.html";
  }

  const jobsContainer = document.getElementById("jobsContainer");
  const messageBox = document.getElementById("message");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
  }

  function statusClass(status) {
    if (!status) return "";
    return status.toLowerCase();
  }

  async function loadJobs() {
    try {
      const jobsResponse = await fetch(API + "/jobs");
      const jobs = await jobsResponse.json();

      const myJobs = jobs.filter(job =>
        job.customerEmail === user.email
      );

      if (myJobs.length === 0) {
        jobsContainer.innerHTML = `
          <div class="empty">
            <p>You have not posted any jobs yet.</p>
          </div>
        `;
        return;
      }

      const applicationsResponse = await fetch(
        API + "/customer-applications?email=" +
        encodeURIComponent(user.email)
      );

      const applications = await applicationsResponse.json();

      jobsContainer.innerHTML = "";

      myJobs.forEach(job => {

        const jobApplications = applications.filter(app =>
          String(app.jobId) === String(job._id)
        );

        let applicationsHTML = "";

        if (jobApplications.length === 0) {

          applicationsHTML = `
            <div class="application">
              <p>No assistants have applied yet.</p>
            </div>
          `;

        } else {

          jobApplications.forEach(app => {

            const status = app.status || "Pending";
            const cls = statusClass(status);

            let actionButton = "";

            if (status === "Pending" && job.status === "Open") {
              actionButton = `
                <button
                  onclick="hireAssistant('${job._id}', '${app._id}', this)">
                  Hire Assistant
                </button>
              `;
            }

            applicationsHTML += `
              <div class="application">

                <h3>${app.assistantName || "Assistant"}</h3>

                <p>
                  <strong>Email:</strong>
                  ${app.assistantEmail || "Not provided"}
                </p>

                <p>
                  <strong>Applied:</strong>
                  ${app.createdAt
                    ? new Date(app.createdAt).toLocaleDateString()
                    : "N/A"}
                </p>

                <p class="status ${cls}">
                  Status: ${status}
                </p>

                ${actionButton}

              </div>
            `;
          });
        }

        jobsContainer.innerHTML += `
          <div class="job-card">

            <h2>${job.title || "Untitled Job"}</h2>

            <p class="job-info">
              <strong>Service:</strong>
              ${job.service || "Not specified"}
            </p>

            <p class="job-info">
              <strong>Budget:</strong>
              $${job.budget || "0"}
            </p>

            <p class="job-info">
              <strong>Duration:</strong>
              ${job.duration || "Not specified"}
            </p>

            <p class="job-info">
              <strong>Description:</strong>
              ${job.description || "No description"}
            </p>

            <p class="job-info">
              <strong>Job Status:</strong>
              <span class="status ${statusClass(job.status)}">
                ${job.status || "Open"}
              </span>
            </p>

            <h3>Applications</h3>

            ${applicationsHTML}

          </div>
        `;
      });

    } catch (error) {

      console.error(error);

      jobsContainer.innerHTML = `
        <div class="empty">
          <p>Unable to load your jobs.</p>
          <button onclick="loadJobs()">Try Again</button>
        </div>
      `;
    }
  }

  async function hireAssistant(jobId, applicationId, button) {

    const confirmHire = confirm(
      "Are you sure you want to hire this assistant?"
    );

    if (!confirmHire) {
      return;
    }

    button.disabled = true;
    button.textContent = "Hiring...";

    try {

      const response = await fetch(API + "/hire-assistant", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          jobId: jobId,
          applicationId: applicationId,
          customerEmail: user.email
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message || "Unable to hire assistant."
        );
      }

      showMessage(
        "Assistant hired successfully!",
        "success"
      );

      await loadJobs();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Something went wrong.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Hire Assistant";
    }
  }

  loadJobs();
</script>

</body>
</html>
