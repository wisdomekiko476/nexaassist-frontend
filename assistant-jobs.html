<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Available Jobs - NexaAssist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #123b72;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #123b72;
      text-decoration: none;
      font-weight: bold;
    }

    .job {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .job h2 {
      margin-top: 0;
      color: #123b72;
      text-transform: capitalize;
    }

    .job p {
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      background: #e7f6ea;
      color: #19763a;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      background: #123b72;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0d2d57;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Available Jobs</h1>

    <p class="subtitle">
      Browse jobs posted by businesses looking for virtual assistants.
    </p>

    <a class="back" href="assistant-dashboard.html">
      ← Back to Dashboard
    </a>

    <div id="jobs">
      Loading jobs...
    </div>

  </div>


  <script>

    const API_URL =
      "https://nexaassist-backend-new-1.onrender.com";


    const user =
      JSON.parse(
        localStorage.getItem("nexaassistUser")
      );


    if (!user) {

      window.location.href =
        "login.html";

    }


    if (
      user &&
      user.role !== "assistant"
    ) {

      window.location.href =
        "client-dashboard.html";

    }


    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value || "";

      return div.innerHTML;

    }


    async function loadJobs() {

      const jobsContainer =
        document.getElementById("jobs");


      try {

        const response =
          await fetch(
            API_URL + "/jobs"
          );


        const jobs =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(
            "Failed to load jobs."
          );

        }


        if (
          !jobs ||
          jobs.length === 0
        ) {

          jobsContainer.innerHTML = `
            <div class="empty">
              <p>No jobs are available right now.</p>
            </div>
          `;

          return;

        }


        jobsContainer.innerHTML =
          jobs.map(job => {

            return `

              <div class="job">

                <h2>
                  ${escapeHTML(job.jobTitle)}
                </h2>

                <p>
                  <strong>Service:</strong>
                  ${escapeHTML(job.service)}
                </p>

                <p>
                  <strong>Budget:</strong>
                  ${escapeHTML(job.budget)}
                </p>

                <p>
                  <strong>Duration:</strong>
                  ${escapeHTML(job.duration)}
                </p>

                <p>
                  <strong>Description:</strong><br>
                  ${escapeHTML(job.description)}
                </p>

                <div class="status">
                  ${escapeHTML(job.status)}
                </div>

                <br>

                <button
                  onclick="applyForJob(
                    '${job._id}'
                  )"
                  id="apply-${job._id}"
                >
                  Apply for Job
                </button>

                <div
                  class="message"
                  id="message-${job._id}"
                ></div>

              </div>

            `;

          }).join("");


      } catch (error) {

        console.log(error);

        jobsContainer.innerHTML = `

          <div class="empty">

            <p>
              Unable to load jobs right now.
            </p>

          </div>

        `;

      }

    }


    async function applyForJob(jobId) {

      const button =
        document.getElementById(
          "apply-" + jobId
        );


      const message =
        document.getElementById(
          "message-" + jobId
        );


      button.disabled = true;

      button.textContent =
        "Submitting...";


      message.textContent =
        "";


      try {

        const response =
          await fetch(
            API_URL + "/applications",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                jobId:
                  jobId,

                assistantName:
                  user.fullName,

                assistantEmail:
                  user.email

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Failed to submit application."
          );

        }


        message.style.color =
          "green";

        message.textContent =
          "Application submitted successfully!";


        button.textContent =
          "Applied";


      } catch (error) {

        console.log(error);

        message.style.color =
          "red";

        message.textContent =
          error.message;


        button.disabled =
          false;

        button.textContent =
          "Apply for Job";

      }

    }


    loadJobs();

  </script>

</body>

</html>
