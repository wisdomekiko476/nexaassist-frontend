<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Jobs - NexaAssist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #123b72;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #123b72;
      text-decoration: none;
      font-weight: bold;
    }

    .job {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .job h2 {
      margin-top: 0;
      color: #123b72;
      text-transform: capitalize;
    }

    .job p {
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      background: #e7f6ea;
      color: #19763a;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .applications {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .application-count {
      font-weight: bold;
      color: #123b72;
    }

    .empty,
    .error {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>My Jobs</h1>

    <p class="subtitle">
      View the jobs you have posted and the assistants who have applied.
    </p>

    <a class="back" href="client-dashboard.html">
      ← Back to Dashboard
    </a>

    <div id="jobs">
      Loading your jobs...
    </div>

  </div>


  <script>

    const API_URL =
      "https://nexaassist-backend-new-1.onrender.com";


    const user =
      JSON.parse(
        localStorage.getItem("nexaassistUser")
      );


    if (!user) {

      window.location.href =
        "login.html";

    }


    if (
      user &&
      user.role !== "client"
    ) {

      window.location.href =
        "assistant-dashboard.html";

    }


    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value || "";

      return div.innerHTML;

    }


    async function loadJobs() {

      const container =
        document.getElementById("jobs");


      try {

        const response =
          await fetch(
            API_URL + "/jobs"
          );


        const allJobs =
          await response.json();


        if (!response.ok) {

          throw new Error(
            "Failed to load jobs."
          );

        }


        const myJobs =
          allJobs.filter(
            job =>
              job.customerEmail &&
              job.customerEmail.toLowerCase() ===
              user.email.toLowerCase()
          );


        if (
          myJobs.length === 0
        ) {

          container.innerHTML = `

            <div class="empty">

              <p>
                You have not posted any jobs yet.
              </p>

            </div>

          `;

          return;

        }


        container.innerHTML =
          myJobs.map(job => {

            return `

              <div class="job">

                <h2>
                  ${escapeHTML(
                    job.jobTitle
                  )}
                </h2>

                <p>
                  <strong>
                    Service:
                  </strong>
                  ${escapeHTML(
                    job.service
                  )}
                </p>

                <p>
                  <strong>
                    Budget:
                  </strong>
                  ${escapeHTML(
                    job.budget
                  )}
                </p>

                <p>
                  <strong>
                    Duration:
                  </strong>
                  ${escapeHTML(
                    job.duration
                  )}
                </p>

                <p>
                  <strong>
                    Description:
                  </strong><br>
                  ${escapeHTML(
                    job.description
                  )}
                </p>

                <div class="status">
                  ${escapeHTML(
                    job.status
                  )}
                </div>

                <div class="applications">

                  <p class="application-count">
                    Applications
                  </p>

                  <p>
                    Applications will appear here when assistants apply.
                  </p>

                </div>

              </div>

            `;

          }).join("");


      } catch (error) {

        console.log(error);

        container.innerHTML = `

          <div class="error">

            <p>
              Unable to load your jobs right now.
            </p>

          </div>

        `;

      }

    }


    loadJobs();

  </script>

</body>

</html>
