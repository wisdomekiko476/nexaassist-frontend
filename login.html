<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | NexaAssist</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 30px;

      border-radius: 12px;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #0b5ed7;
      font-size: 30px;
    }

    .logo p {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ccc;

      border-radius: 7px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #0b5ed7;
    }

    .login-button {
      width: 100%;

      padding: 13px;

      background: #0b5ed7;

      color: white;

      border: none;

      border-radius: 7px;

      font-size: 16px;

      cursor: pointer;

      margin-top: 5px;
    }

    .login-button:hover {
      background: #084298;
    }

    .login-button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .links {
      text-align: center;

      margin-top: 22px;

      font-size: 14px;
    }

    .links a {
      color: #0b5ed7;

      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

  </style>

</head>


<body>


  <div class="login-container">


    <div class="logo">

      <h1>NexaAssist</h1>

      <p>
        Virtual Assistant Marketplace
      </p>

    </div>


    <h2>
      Login
    </h2>


    <form id="loginForm">


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>


    <div class="links">

      <p>
        Don't have an account?
        <a href="signup.html">
          Sign up
        </a>
      </p>

      <br>

      <p>
        <a href="index.html">
          Back to Home
        </a>
      </p>

    </div>


  </div>


  <script>


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        message.textContent =
          "Logging in...";


        message.className =
          "message";


        loginButton.disabled = true;


        try {


          const response =
            await fetch(
              "https://nexaassist-backend-new-1.onrender.com/login",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  email: email,

                  password: password

                })

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Login failed."
            );

          }


          /*
            Save the logged-in
            user's information.
          */

          localStorage.setItem(
            "nexaassistUser",
            JSON.stringify(data.user)
          );


          message.textContent =
            "Login successful!";


          message.className =
            "message success";


          /*
            Send the user to the
            correct dashboard.
          */

          setTimeout(
            function() {


              if (
                data.user.role ===
                "assistant"
              ) {

                window.location.href =
                  "assistant-dashboard.html";

              }

              else if (
                data.user.role ===
                "client"
              ) {

                window.location.href =
                  "client-dashboard.html";

              }

              else {

                window.location.href =
                  "index.html";

              }


            },
            800
          );


        }

        catch (error) {


          message.textContent =
            error.message;


          message.className =
            "message error";


          loginButton.disabled =
            false;

        }

      }
    );


  </script>


</body>

</html>
