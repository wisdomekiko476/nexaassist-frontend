<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Available Jobs | NexaAssist</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      font-size: 23px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .top h2 {
      margin-bottom: 8px;
    }

    .top p {
      color: #666;
      line-height: 1.5;
    }

    .job-list {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(280px, 1fr)
        );

      gap: 18px;
    }

    .job-card {
      background: white;

      padding: 25px;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.06);
    }

    .job-card h3 {
      color: #0b5ed7;
      margin-bottom: 12px;
    }

    .job-info {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .job-info strong {
      color: #333;
    }

    .description {
      margin-top: 15px;

      color: #555;

      line-height: 1.5;
    }

    .status {
      display: inline-block;

      margin-top: 15px;

      padding: 6px 10px;

      background: #e8f7ee;

      color: #18794e;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }

    .button {
      display: inline-block;

      margin-top: 18px;

      padding: 11px 18px;

      background: #0b5ed7;

      color: white;

      text-decoration: none;

      border: none;

      border-radius: 7px;

      cursor: pointer;

      font-size: 14px;
    }

    .button:hover {
      background: #084298;
    }

    .back-button {
      background: #6c757d;
    }

    .back-button:hover {
      background: #565e64;
    }

    .message {
      background: white;

      padding: 25px;

      border-radius: 12px;

      text-align: center;

      color: #666;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.06);
    }

    .error {
      color: #dc3545;
    }

    footer {
      text-align: center;

      padding: 30px 20px;

      color: #777;

      font-size: 14px;
    }

  </style>

</head>


<body>


  <header>

    <h1>
      NexaAssist
    </h1>

    <p>
      Available Jobs
    </p>

  </header>


  <div class="container">


    <div class="top">

      <h2>
        Available Jobs
      </h2>

      <p>
        Browse jobs posted by businesses
        looking for virtual assistants.
      </p>

      <a
        href="assistant-dashboard.html"
        class="button back-button"
      >
        Back to Dashboard
      </a>

    </div>


    <div
      id="jobList"
      class="job-list"
    >

      <div class="message">
        Loading available jobs...
      </div>

    </div>


  </div>


  <footer>

    © 2026 NexaAssist.
    All rights reserved.

  </footer>


  <script>


    const userData =
      localStorage.getItem(
        "nexaassistUser"
      );


    if (!userData) {

      window.location.href =
        "login.html";

    }


    const user =
      JSON.parse(userData);


    if (user.role !== "assistant") {

      window.location.href =
        "client-dashboard.html";

    }


    const jobList =
      document.getElementById(
        "jobList"
      );


    async function loadJobs() {

      try {


        const response =
          await fetch(
            "https://nexaassist-backend-new-1.onrender.com/jobs"
          );


        const jobs =
          await response.json();


        if (!response.ok) {

          throw new Error(
            jobs.message ||
            "Failed to load jobs."
          );

        }


        if (
          !Array.isArray(jobs) ||
          jobs.length === 0
        ) {

          jobList.innerHTML = `

            <div class="message">

              <h3>
                No jobs available yet
              </h3>

              <p style="margin-top:10px;">
                New customer jobs will appear here
                when they are posted.
              </p>

            </div>

          `;

          return;

        }


        jobList.innerHTML = "";


        jobs.forEach(
          function(job) {


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "job-card";


            card.innerHTML = `

              <h3>
                ${escapeHtml(
                  job.jobTitle
                )}
              </h3>

              <div class="job-info">

                <strong>
                  Service:
                </strong>

                ${escapeHtml(
                  job.service
                )}

              </div>

              <div class="job-info">

                <strong>
                  Budget:
                </strong>

                ${escapeHtml(
                  job.budget
                )}

              </div>

              <div class="job-info">

                <strong>
                  Duration:
                </strong>

                ${escapeHtml(
                  job.duration
                )}

              </div>

              <div class="description">

                <strong>
                  Description:
                </strong>

                <br>

                ${escapeHtml(
                  job.description
                )}

              </div>

              <span class="status">

                ${escapeHtml(
                  job.status || "Open"
                )}

              </span>

              <br>

              <button
                class="button"
                onclick="applyForJob('${job._id}')"
              >
                Apply for Job
              </button>

            `;


            jobList.appendChild(
              card
            );


          }
        );


      }

      catch (error) {


        jobList.innerHTML = `

          <div class="message error">

            <h3>
              Unable to load jobs
            </h3>

            <p style="margin-top:10px;">
              ${escapeHtml(
                error.message
              )}
            </p>

          </div>

        `;

      }

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function applyForJob(jobId) {

      alert(
        "Job application will be connected to the backend next."
      );

    }


    loadJobs();


  </script>


</body>

</html>
